# GitLab CI — bản tương đương .github/workflows (dùng GitHub thì xoá file này, và ngược lại).
# static: mỗi push/MR (không secret). integration + regression: manual/scheduled.
# Secrets khai ở Settings → CI/CD → Variables (masked/protected): JIRA_*, XRAY_*, OPS_*, CONFLUENCE_*.

stages:
  - static
  - integration
  - regression
  - report

# ---- Static / quality check (mỗi push & MR, không secret, không UAT) ----
static-check:
  stage: static
  image: node:20
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
    - find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
    - node -e "['knowledge/index.json','.agent/config/risk_model.example.json','.agent/config/dashboard.branding.example.json'].forEach(f=>{JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('JSON OK',f)})"
    - npm run gate:policy
    - npm run secret:scan
    - 'npm audit --omit=dev || echo "(audit advisory — xem canh bao o tren; chua chan o high/moderate)"'
    - npm run audit:ci
    - npm run lint
    - npm run typecheck
    - npm run dashboard
    - npm run risk
    - 'if node scripts/qa/security_check.js --catalog .agent/config/dashboard.branding.example.json; then echo "security guard PHAI tu choi khi thieu --confirm-nonprod"; exit 1; else echo "security guard OK"; fi'

# ---- Integration check (MANUAL, dry-run — KHÔNG publish/log Jira thật) ----
integration-check:
  stage: integration
  image: node:20
  when: manual
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run integration:check:live

# ---- Live regression (MANUAL hoặc scheduled — KHÔNG mỗi push; hit UAT) ----
regression:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble   # đổi tag khớp @playwright/test trong package.json
  # Chỉ chạy khi scheduled (nightly) hoặc khi bấm "Run pipeline" trên UI (source=web).
  # KHÔNG chạy/khối trên push thường → push chỉ có static-check.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  parallel: 4
  variables:
    PROJECT_OUTPUT_DIR: "outputs/ci"          # playwright.config THROW nếu thiếu 2 biến này
    TASK_KEY: "CI-REGRESSION"
    RUN_ID: "ci-$CI_PIPELINE_ID-$CI_NODE_INDEX"
    ALLOW_EMPTY: "1"                          # suite chung chưa promote spec → rỗng hợp lệ, gate GHI NO_TESTS (F6 xong thì bỏ)
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright install chromium webkit
    # F1 — chống false-green: đếm test trước; NO_TESTS được GHI RÕ thay vì báo PASSED giả.
    - node scripts/qa/test_inventory_gate.js --out inventory.json
    - |
      STATE=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('inventory.json','utf8')).state)}catch(e){process.stdout.write('INFRA_FAILURE')}")
      echo "inventory state = $STATE"
      if [ "$STATE" = "HAS_TESTS" ]; then
        npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=blob --pass-with-no-tests
      elif [ "$STATE" = "NO_TESTS" ]; then
        echo "NO_TESTS_EXECUTED — suite regression chung chua co spec promoted. KHONG phai PASSED."
      else
        echo "INFRA_FAILURE - playwright/config loi"; exit 1
      fi
  artifacts:
    when: always
    paths: [blob-report/]
    expire_in: 1 week

merge-report:
  stage: report
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  # Cùng điều kiện với regression (schedule/web); trên push cả 2 đều vắng → chỉ static-check chạy.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  needs:
    - job: regression
      artifacts: true
  # METRICS_PUSH_TOKEN (masked CI var, Project Access Token scope write_repository) BẬT commit-back
  # persistence. Chưa có token → job vẫn chạy, chỉ ra artifact (không đỏ).
  variables:
    GIT_DEPTH: "0"   # cần full history để rebase/push commit-back
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright merge-reports --reporter=html blob-report/ || echo "no blob to merge"
    # F11/F10 — thu KPI + reliability từ blob (merge JSON) → tích luỹ knowledge/metrics.
    - PLAYWRIGHT_JSON_OUTPUT_NAME=merged-results.json npx playwright merge-reports --reporter=json blob-report/ || echo "(no blob for json)"
    - node scripts/qa/metrics_collect.js --results merged-results.json --label "ci-$CI_PIPELINE_ID" || echo "(metrics skip)"
    - node scripts/qa/reliability_index.js || echo "(reliability skip)"
    # Persistence Option A — commit-back metrics vào knowledge/ (versioned). CHỈ scheduled + có token.
    # Best-effort ([skip ci] tránh loop; || echo để không đỏ pipeline nếu conflict/thiếu quyền).
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ -n "$METRICS_PUSH_TOKEN" ]; then
        git config user.email "ci-metrics@sapp.edu.vn"
        git config user.name "CI Metrics Bot"
        git add knowledge/metrics/runs.jsonl knowledge/metrics/tc-history.jsonl knowledge/metrics/reliability-index.json knowledge/metrics/reliability-index.md knowledge/metrics/quarantine.json 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "(persistence) metrics khong doi — bo qua commit"
        else
          git commit -m "chore(metrics): tich luy KPI/reliability tu run $CI_PIPELINE_ID [skip ci]"
          REMOTE="https://oauth2:${METRICS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
          git pull --rebase "$REMOTE" "$CI_DEFAULT_BRANCH" || echo "(persistence) rebase skip"
          git push "$REMOTE" "HEAD:${CI_DEFAULT_BRANCH}" && echo "(persistence) metrics pushed" || echo "(persistence) push skip — kiem tra token/quyen write_repository"
        fi
      else
        echo "(persistence) bo qua commit-back — can scheduled + METRICS_PUSH_TOKEN; hien artifact-only"
      fi
  artifacts:
    when: always
    paths: [playwright-report/, knowledge/metrics/]
    expire_in: 2 weeks
