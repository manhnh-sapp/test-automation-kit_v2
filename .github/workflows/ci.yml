# Live regression — NIGHTLY hoặc MANUAL (KHÔNG every-push, tránh nã UAT mỗi commit).
# Sharded + gộp 1 HTML report. Chỉ có nghĩa khi có spec committed (tests/fe|api promoted);
# chưa có spec → --pass-with-no-tests giữ xanh (không đỏ oan). Static check ở static-check.yml.
name: ci-regression

on:
  schedule:
    - cron: '0 18 * * *'   # ~01:00 giờ VN hằng ngày (UTC+7). Đổi tuỳ team.
  workflow_dispatch:

# playwright.config.js THROW nếu thiếu PROJECT_OUTPUT_DIR + TASK_KEY khi load → phải set.
env:
  PROJECT_OUTPUT_DIR: outputs/ci
  TASK_KEY: CI-REGRESSION

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]   # đổi số phần tử để tăng/giảm song song
    env:
      RUN_ID: ci-${{ github.run_id }}-${{ matrix.shard }}
      OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
      OPS_USERNAME: ${{ secrets.OPS_USERNAME }}
      OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      # F1 — chống false-green: đếm test trước. Suite regression CHUNG chưa promote spec (tests/fe|api)
      # → rỗng là hợp lệ (ALLOW_EMPTY=1), NHƯNG gate GHI RÕ NO_TESTS thay vì báo PASSED giả.
      # Khi đã promote spec thật (F6): bỏ ALLOW_EMPTY để 0-test thành ĐỎ.
      # F1 — inventory gate ĐÚNG SCOPE SHARD (--list --shard) → phát hiện SHARD_EMPTY, KHÔNG dùng
      # --pass-with-no-tests (đã biết shard có test mới chạy) → chặn false-green cả ở mức shard.
      - name: Test inventory gate (F1 — per shard)
        env:
          ALLOW_EMPTY: '1'
        run: node scripts/qa/test_inventory_gate.js --out inventory-${{ matrix.shard }}.json -- --shard=${{ matrix.shard }}/4

      - name: Sharded regression (blob report)
        run: |
          STATE=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('inventory-${{ matrix.shard }}.json','utf8')).state)}catch(e){process.stdout.write('INFRA_FAILURE')}")
          echo "shard ${{ matrix.shard }}/4 inventory = $STATE"
          if [ "$STATE" = "HAS_TESTS" ]; then
            npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
          elif [ "$STATE" = "NO_TESTS" ]; then
            echo "SHARD_EMPTY — shard ${{ matrix.shard }} không có test (suite chung chưa promote spec). KHÔNG phải PASSED."
          else
            echo "INFRA_FAILURE — playwright/config lỗi, không đếm được test"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-${{ matrix.shard }}
          path: inventory-${{ matrix.shard }}.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # ---- Cross-browser lane (MANUAL only — Firefox/WebKit) ----
  # `project` trong Playwright = NHÂN BẢN suite (không chia việc) → để LÀN RIÊNG, KHÔNG nhét vào
  # nightly regression: tránh nhân 3× lượt chạy, 3× evidence và 3× nhiễu flaky (đầu độc TRI/risk model).
  # Lane này CHỈ thêm 2 engine phụ; chromium do job `regression` lo.
  cross-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TASK_KEY: CI-CROSS-BROWSER
      RUN_ID: xb-${{ github.run_id }}
      CROSS_BROWSER: '1'          # bật 2 project firefox-desktop + webkit-desktop
      ALLOW_EMPTY: '1'            # bỏ khi lane đã có spec promoted (0-test thành ĐỎ)
      # CROSS_BROWSER_GREP: '@cross-browser'   # BẬT khi suite lớn: engine phụ chỉ chạy tập critical
      OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
      OPS_USERNAME: ${{ secrets.OPS_USERNAME }}
      OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # webkit đã cài ở lane regression (iphone-13 dùng engine webkit); FIREFOX chỉ cài Ở ĐÂY.
      - run: npx playwright install --with-deps firefox webkit

      - name: Inventory gate (F1 — đúng scope 2 engine phụ)
        run: node scripts/qa/test_inventory_gate.js --out inventory-xb.json -- --project=firefox-desktop --project=webkit-desktop

      - name: Cross-browser run (Firefox + WebKit)
        run: |
          STATE=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('inventory-xb.json','utf8')).state)}catch(e){process.stdout.write('INFRA_FAILURE')}")
          echo "cross-browser inventory = $STATE"
          if [ "$STATE" = "HAS_TESTS" ]; then
            npx playwright test --project=firefox-desktop --project=webkit-desktop --reporter=html
          elif [ "$STATE" = "NO_TESTS" ]; then
            echo "NO_TESTS_EXECUTED — lane cross-browser rỗng (chưa promote spec hoặc GREP không khớp). KHÔNG phải PASSED."
          else
            echo "INFRA_FAILURE — playwright/config lỗi"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-report
          path: |
            playwright-report/
            inventory-xb.json
          retention-days: 7
          if-no-files-found: ignore

  merge-report:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-*
          merge-multiple: true
      - name: Gộp thành 1 HTML report
        run: npx playwright merge-reports --reporter=html all-blobs || echo "no blob to merge"
      - uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # F11 — thu KPI mỗi run (merged JSON → knowledge/metrics) + F10 reliability. Best-effort, không chặn.
      # LƯU Ý: mỗi run checkout mới → artifact chỉ có KPI run này; trend xuyên run cần commit/central store (P2).
      - name: KPI metrics (F11) + reliability (F10)
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=merged-results.json npx playwright merge-reports --reporter=json all-blobs || echo "(no blob for json)"
          node scripts/qa/metrics_collect.js --results merged-results.json --label "ci-${{ github.run_id }}" || echo "(metrics skip)"
          node scripts/qa/reliability_index.js || echo "(reliability skip)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: knowledge/metrics/
          retention-days: 30
          if-no-files-found: ignore
